<!-- Dunkelmodus: gespeicherte Wahl sofort setzen, damit die Seite nicht hell aufblitzt.
     Standard ist hell. Der Knopf oben rechts schaltet um (assets/js/dunkelmodus.js). -->
<script>
  try {
    if (localStorage.getItem('fff-modus') === 'dunkel') {
      document.documentElement.setAttribute('data-modus', 'dunkel');
    }
  } catch (e) {}
</script>

<link rel="icon" type="image/png" sizes="192x192" href="{{ '/assets/images/favicon/favicon-192.png' | relative_url }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/images/favicon/apple-touch-icon.png' | relative_url }}">
